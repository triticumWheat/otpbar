name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test -Xswiftc -warnings-as-errors
      - run: bash scripts/build-app.sh
      - name: Package
        run: ditto -c -k --keepParent .build/app/OTPBar.app "OTPBar-${GITHUB_REF_NAME}-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: OTPBar-*-macOS.zip
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test windows -warnaserror
      - name: Build
        shell: pwsh
        run: |
          # On a manual run there is no tag to take a version from.
          $version = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME } else { '0.0.0' }
          powershell -File windows\build.ps1 -Version $version
      - name: Package
        shell: pwsh
        run: Compress-Archive windows\.build\OTPBar.exe "OTPBar-$env:GITHUB_REF_NAME-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: OTPBar-*-windows-x64.zip
          if-no-files-found: error

  publish:
    needs: [macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - name: Attach both packages to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" */OTPBar-*.zip --clobber
